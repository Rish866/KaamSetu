name: CI

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder' }}
  EXPO_NO_TELEMETRY: 1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, unit, database and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Migration validation, RLS adversarial tests, workflow and journey tests
        run: npm run test:db
      - name: Generated database types are up to date
        run: npm run gen:types && git diff --exit-code src/lib/database.types.ts
      - name: Applied migrations are never edited
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only --diff-filter=MD "origin/${{ github.base_ref }}" -- supabase/migrations || true)
          if [ -n "$changed" ]; then echo "Existing migrations were modified or deleted: $changed"; exit 1; fi
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev

  supabase-db:
    name: Migrations, upgrade rehearsal and DB tests on real Supabase Postgres (local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Upgrade rehearsal (v1.3.0-shaped data, then pending migrations)
        run: bash scripts/rehearse-upgrade.sh
      - name: Fresh database with all migrations
        run: supabase db start && supabase migration list
      - name: Catalog checks (same script as production)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/production-checks.sql
      - name: Database test suite against real Supabase Postgres
        env:
          KAAMSETU_PG_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          status=0
          for f in tests/db/*.test.mjs; do
            supabase db reset >/dev/null
            echo "::group::$f"; node --test --test-reporter=spec "$f" || status=1; echo "::endgroup::"
          done
          exit $status

  e2e-local-stack:
    name: Real UI journeys on a local Supabase stack (auth, storage, marketplace)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: npx playwright install --with-deps chromium
      - name: Pull ClamAV image (signature database included)
        run: docker pull clamav/clamav:stable && docker run --rm --entrypoint clamscan clamav/clamav:stable --version
      - name: Local stack + local production build + live specs + workers
        env:
          CLAMSCAN_CMD: bash scripts/workers/clamscan-docker.sh
          CLAMSCAN_VERSION_CMD: docker run --rm --entrypoint clamscan clamav/clamav:stable --version
        run: bash scripts/local-stack-e2e.sh
      - name: Results summary
        if: always()
        run: |
          [ -f test-results/live-results.json ] && jq -r '.suites[] | .title as $f | (.. | objects | select(has("specs")) | .specs[]? | "\($f) | \(.title) | \(.tests[0].results[-1].status // "not run")")' test-results/live-results.json | sort -u || echo "no results file"

  edge-functions:
    name: Edge Functions type check (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        working-directory: supabase/functions
        run: deno check unsubscribe/index.ts _shared/resume-core.ts _shared/email-templates.ts _shared/scanner.ts

  web:
    name: Web production build, browser, accessibility and responsive tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: No service-role secrets in the web bundle
        run: |
          # Real secret keys look like sb_secret_<40+ chars>; legacy service JWTs contain base64 of "service_role".
          if grep -rIl -E "sb_secret_[A-Za-z0-9_-]{20,}|c2VydmljZV9yb2xl|SUPABASE_SERVICE_ROLE_KEY" dist; then echo "Secret key material found in dist"; exit 1; fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package the tested website (deployable archive + manifest + checksum)
        if: vars.EXPO_PUBLIC_SUPABASE_URL != ''
        run: bash scripts/package-website.sh "${{ github.event.pull_request.head.sha || github.sha }}" "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@v4
        if: vars.EXPO_PUBLIC_SUPABASE_URL != ''
        with:
          name: website-${{ github.event.pull_request.head.sha || github.sha }}
          path: website-package/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results

  website-rollback-package:
    name: Rollback website package (current production code on main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.EXPO_PUBLIC_SUPABASE_URL != ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main (what production runs today)
        working-directory: base
        run: npm ci && npx expo export --platform web
      - name: Same app source as the latest release tag (what the live site was built from)
        working-directory: base
        run: |
          # Bundle hashes are not a reliable identity check: Metro module numbering shifts with build environment.
          # Instead require that the app source on main is byte-identical to the latest release tag.
          git fetch -q --tags origin
          tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          git diff --quiet "$tag" HEAD -- src app.json package.json package-lock.json index.ts App.tsx assets \
            && echo "App source on main is identical to $tag." \
            || echo "::warning::App source on main is ahead of $tag. The rollback package is main, which is correct only if the live site was deployed from the current main (check the deploy log in docs/AUDIT.md)."
      - name: Package
        working-directory: base
        run: bash ../head/scripts/package-website.sh "rollback-${{ github.event.pull_request.base.sha }}" none
      - uses: actions/upload-artifact@v4
        with:
          name: website-rollback-${{ github.event.pull_request.base.sha }}
          path: base/website-package/
          retention-days: 90
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner
