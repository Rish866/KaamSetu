name: Production database

# Manual, audited operations on production Supabase (project zrexqtzhdkkupyxmfqxd).
# Secrets required (owner adds them in Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, BACKUP_PASSPHRASE (backups are encrypted; this repository is public).
# Dispatch with ref = the branch whose migrations should be checked or applied.
on:
  workflow_dispatch:
    inputs:
      action:
        description: status | backup | dry-run | drift | apply | checks | functions | auth-probe | email-setup | email-test | restore-drill
        type: choice
        options: [status, backup, dry-run, drift, apply, checks, functions, auth-probe, email-setup, email-test, restore-drill]
        default: status
      confirm:
        description: 'Required for apply: type APPLY zrexqtzhdkkupyxmfqxd'
        required: false
        default: ''

permissions:
  contents: read
  actions: read # restore-drill downloads the latest backup artifact of this repository

concurrency:
  group: production-database
  cancel-in-progress: false

env:
  PROJECT_REF: zrexqtzhdkkupyxmfqxd

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets and confirmation
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          P: ${{ secrets.SUPABASE_DB_PASSWORD }}
          B: ${{ secrets.BACKUP_PASSPHRASE }}
          R: ${{ secrets.RESEND_API_KEY }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          missing=""
          [ -z "$T" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$P" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ "$ACTION" = "backup" ] || [ "$ACTION" = "apply" ] || [ "$ACTION" = "restore-drill" ]; then [ -z "$B" ] && missing="$missing BACKUP_PASSPHRASE"; fi
          if { [ "$ACTION" = "email-setup" ] || [ "$ACTION" = "email-test" ]; } && [ -z "$R" ]; then missing="$missing RESEND_API_KEY"; fi
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          if [ "$ACTION" = "apply" ] && [ "$CONFIRM" != "APPLY $PROJECT_REF" ]; then echo "::error::apply requires confirm = 'APPLY $PROJECT_REF'"; exit 1; fi
          echo "Ref: $GITHUB_REF @ $GITHUB_SHA, action: $ACTION"

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migration history (remote vs this ref)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Resolve session-pooler connection (Management API)
        id: conn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          cfg=$(curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler")
          cs=$(echo "$cfg" | jq -r '([.[] | select(.database_type == "PRIMARY")][0] // .[0]).connection_string')
          [ -n "$cs" ] && [ "$cs" != "null" ] || { echo "::error::Could not resolve the pooler connection string"; exit 1; }
          pw=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          # Session mode (port 5432) supports psql; the API returns the transaction-mode string (6543).
          url=$(echo "$cs" | sed -e "s|\[YOUR-PASSWORD\]|$pw|" -e 's|:6543/|:5432/|')
          case "$url" in *sslmode=*) ;; *\?*) url="$url&sslmode=require" ;; *) url="$url?sslmode=require" ;; esac
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Production server version and extensions (read-only)
        if: inputs.action == 'drift' || inputs.action == 'dry-run'
        env:
          DB_URL: ${{ steps.conn.outputs.url }}
        run: |
          psql "$DB_URL" -At -c "show server_version" -c "select extname || ' ' || extversion from pg_extension order by 1"
          psql "$DB_URL" -c "select p.oid::regprocedure as function, pg_get_userbyid(p.proowner) as owner, p.proacl from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and pg_get_userbyid(p.proowner) <> 'postgres'" -c "select evtname, evtevent, evtenabled, evtfoid::regprocedure, pg_get_userbyid(evtowner) as owner from pg_event_trigger order by 1"

      - name: Schema drift check (production vs. the migrations it has recorded as applied; read-only)
        if: inputs.action == 'drift'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          applied=$(supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | sed -nE 's/^ *`([0-9]+)` \| `([0-9]+)`.*/\2/p')
          echo "Remote applied: $applied"
          W=$(mktemp -d); mkdir -p "$W/supabase/migrations"; cp supabase/config.toml "$W/supabase/"; cp -r supabase/.temp "$W/supabase/" 2>/dev/null || true
          for v in $applied; do cp supabase/migrations/${v}_*.sql "$W/supabase/migrations/"; done
          ls "$W/supabase/migrations"
          supabase db diff --linked --workdir "$W" --schema public,private > drift.sql
          cat drift.sql
          node scripts/classify-drift.mjs drift.sql

      - name: Pre-flight data checks (read-only)
        if: contains(fromJSON('["status","backup","dry-run","drift","apply"]'), inputs.action)
        env:
          DB_URL: ${{ steps.conn.outputs.url }}
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/preflight.sql

      - name: Encrypted backup (schema, data, roles)
        if: inputs.action == 'backup' || inputs.action == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ); mkdir -p backup
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f "backup/$stamp-schema.sql"
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f "backup/$stamp-data.sql"
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --role-only -f "backup/$stamp-roles.sql"
          for f in backup/*.sql; do
            echo "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
            shred -u "$f"
          done
          (cd backup && sha256sum *.gpg | tee SHA256SUMS.txt && wc -c *.gpg)
          echo "BACKUP_STAMP=$stamp" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        id: backup_upload
        if: inputs.action == 'backup' || inputs.action == 'apply'
        with:
          name: production-backup-${{ env.BACKUP_STAMP }}
          path: backup/
          retention-days: 30
          if-no-files-found: error

      - name: Verify the backup artifact exists before anything is applied
        if: inputs.action == 'backup' || inputs.action == 'apply'
        env:
          ID: ${{ steps.backup_upload.outputs.artifact-id }}
          DIGEST: ${{ steps.backup_upload.outputs.artifact-digest }}
          URL: ${{ steps.backup_upload.outputs.artifact-url }}
        run: |
          [ -n "$ID" ] || { echo "::error::Backup artifact was not created"; exit 1; }
          for f in backup/*-schema.sql.gpg backup/*-data.sql.gpg backup/*-roles.sql.gpg; do [ -s "$f" ] || { echo "::error::Missing or empty $f"; exit 1; }; done
          echo "Backup artifact $ID ($URL) digest $DIGEST"

      - name: Dry run
        if: inputs.action == 'dry-run' || inputs.action == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply unapplied migrations
        if: inputs.action == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Migration history after apply
        if: inputs.action == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Production catalog checks (RLS, grants, private buckets)
        if: inputs.action == 'apply' || inputs.action == 'checks'
        env:
          DB_URL: ${{ steps.conn.outputs.url }}
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/production-checks.sql

      - uses: actions/setup-node@v4
        if: inputs.action == 'apply' || inputs.action == 'checks'
        with:
          node-version: 22
      - name: Public API verification (anonymous, read-only)
        if: inputs.action == 'apply' || inputs.action == 'checks'
        run: node scripts/verify-production.mjs --expect-schema 202611200006 || echo "::warning::Public verification reported failures (expected until the v1.4.0 website is deployed)."

      - name: Deploy the public unsubscribe Edge Function
        if: inputs.action == 'functions'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy unsubscribe --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions list --project-ref "$PROJECT_REF"

      - name: Project API keys for probes (masked)
        if: inputs.action == 'auth-probe'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          keys=$(curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true")
          a=$(echo "$keys" | jq -r '([.[] | select(.type == "publishable") | .api_key][0]) // ([.[] | select(.name == "anon") | .api_key][0])')
          k=$(echo "$keys" | jq -r '([.[] | select(.type == "secret") | .api_key][0]) // ([.[] | select(.name == "service_role") | .api_key][0])')
          echo "::add-mask::$k"
          echo "ANON_KEY=$a" >> "$GITHUB_ENV"; echo "SERVICE_KEY=$k" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: inputs.action == 'auth-probe'
        with:
          node-version: 22
          cache: npm
      - name: Production sign-up probe (creates and deletes two QA accounts)
        if: inputs.action == 'auth-probe'
        env:
          SUPABASE_URL: https://zrexqtzhdkkupyxmfqxd.supabase.co
          DB_URL: ${{ steps.conn.outputs.url }}
        run: npm ci --ignore-scripts && node scripts/auth-probe.mjs

      - name: Configure Auth SMTP (Resend) through the Management API
        if: inputs.action == 'email-setup'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM: ${{ vars.EMAIL_FROM_ADDRESS || 'no-reply@send.getkaamsetu.in' }}
        run: |
          body=$(jq -n --arg pass "$RESEND_API_KEY" --arg from "$FROM" '{smtp_host:"smtp.resend.com", smtp_port:"465", smtp_user:"resend", smtp_pass:$pass, smtp_admin_email:$from, smtp_sender_name:"KaamSetu", rate_limit_email_sent:30}')
          code=$(curl -sS -o resp.json -w "%{http_code}" -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body" "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth")
          echo "Management API status: $code"; jq '{smtp_host, smtp_port, smtp_user, smtp_admin_email, smtp_sender_name, rate_limit_email_sent}' resp.json
          [ "$code" = "200" ]

      - name: Email queue before sending (read-only; counts only, no addresses)
        if: inputs.action == 'email-test' || inputs.action == 'email-setup'
        env:
          DB_URL: ${{ steps.conn.outputs.url }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            select o.status,
                   count(*) filter (where coalesce(o.address, p.email) like 'qa+%@getkaamsetu.in') as to_qa_test_addresses,
                   count(*) filter (where coalesce(o.address, p.email) is null) as no_address,
                   count(*) filter (where coalesce(o.address, p.email) is not null and coalesce(o.address, p.email) not like 'qa+%@getkaamsetu.in') as to_real_addresses
              from private.email_outbox o left join public.profiles p on p.id = o.recipient_id
             group by 1 order by 1"
          # Pending mail by kind and recipient type. Shows only the address DOMAIN, never the address.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            select o.kind, o.category, p.status as recipient_status,
                   case when coalesce(o.address, p.email) like 'qa+%@getkaamsetu.in' then 'qa test address'
                        else coalesce(split_part(coalesce(o.address, p.email), '@', 2), '(none)') end as address_domain,
                   (o.address is not null) as explicit_address, count(*), min(o.created_at)::date as oldest
              from private.email_outbox o left join public.profiles p on p.id = o.recipient_id
             where o.status = 'pending' group by 1,2,3,4,5 order by 6 desc"

      - name: Send one test email directly through Resend (proves the key and the verified domain)
        if: inputs.action == 'email-test'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM: ${{ vars.EMAIL_FROM_ADDRESS || 'no-reply@send.getkaamsetu.in' }}
          TO: ${{ vars.EMAIL_TEST_TO || 'rishabh@getkaamsetu.in' }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg from "KaamSetu <$FROM>" --arg to "$TO" --arg run "$GITHUB_RUN_ID" '{from:$from, to:[$to], subject:("KaamSetu email test (run " + $run + ")"), text:("This is an automatic test from the KaamSetu website setup. If you can read this, outgoing email works. Run " + $run + ".")}')
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' -d "$body")
          echo "Resend API status: $code"; jq '{id, name, message}' resp.json
          [ "$code" = "200" ]

      - name: Download the latest production backup
        if: inputs.action == 'restore-drill'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name | startswith("production-backup-")) | select(.expired | not)] | sort_by(.created_at) | last | .name')
          [ -n "$name" ] && [ "$name" != "null" ] || { echo "::error::No unexpired production backup artifact (they are kept 30 days). Run action backup first."; exit 1; }
          echo "Restoring $name"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq '.artifacts[0].workflow_run.id')
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$name" -D restore-input
          ls -l restore-input

      - name: Restore drill (new empty Supabase database on this runner; prints counts only)
        if: inputs.action == 'restore-drill'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          EXPECT_SCHEMA: '202611200006'
        run: bash scripts/restore-drill.sh restore-input
