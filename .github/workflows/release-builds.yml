name: Release builds

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build installable release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Stage APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/KaamSetu-${{ github.ref_name }}.apk"
          # Fixed name as well, so the website can always link to .../releases/latest/download/KaamSetu.apk
          cp android/app/build/outputs/apk/release/app-release.apk release/KaamSetu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kaamsetu-android-apk
          path: release/KaamSetu*.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build iOS simulator app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace KaamSetu.xcworkspace \
            -scheme KaamSetu \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Stage iOS simulator bundle
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/Build/Products/Release-iphonesimulator/KaamSetu.app \
            "release/KaamSetu-iOS-Simulator-${{ github.ref_name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kaamsetu-ios-simulator
          path: release/KaamSetu-iOS-Simulator-*.zip
          if-no-files-found: error

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Package website
        run: |
          mkdir -p release
          tar -czf "release/KaamSetu-web-${{ github.ref_name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: kaamsetu-website
          path: release/KaamSetu-web-*.tar.gz
          if-no-files-found: error

  android-aab:
    name: Signed Android App Bundle (when signing is configured)
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SIGNING == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SIGNING == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_SIGNING == 'true'
        run: npm ci && npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v5
        if: env.HAS_SIGNING == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build signed AAB
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          rm -f "$RUNNER_TEMP/upload.jks"
          mkdir -p ../release && cp app/build/outputs/bundle/release/app-release.aab "../release/KaamSetu-${{ github.ref_name }}.aab"
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: kaamsetu-android-aab
          path: release/KaamSetu-*.aab
      - name: Signing not configured
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::ANDROID_KEYSTORE_BASE64 is not set; skipping the signed Play Store bundle."

  ios-testflight:
    name: iOS TestFlight build (when Apple credentials are configured)
    runs-on: ubuntu-latest
    env:
      HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_EXPO == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_EXPO == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build and submit with EAS
        if: env.HAS_EXPO == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm ci && npx eas-cli@latest build --platform ios --profile production --non-interactive --auto-submit
      - name: Apple signing not configured
        if: env.HAS_EXPO != 'true'
        run: echo "::notice::EXPO_TOKEN is not set; skipping TestFlight. Requires Apple Developer Program membership."

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android-apk, ios-simulator, website, android-aab]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kaamsetu-*
          path: release
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Checksums and release notes
        run: |
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          notes="src/docs/releases/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "KaamSetu ${{ github.ref_name }}" > release-notes.md; fi
          printf '\n\n## Assets\n- APK: installable Android test build\n- AAB: signed Play bundle (only when signing is configured)\n- iOS Simulator zip\n- Website archive\n- SHA256SUMS.txt\n' >> release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: KaamSetu ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
